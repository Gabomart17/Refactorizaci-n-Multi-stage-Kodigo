worker_processes auto;
pid /run/nginx.pid;
# Logs a stdout/stderr para verlos con `docker compose logs`
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    # No exponer la versión de Nginx (menos info para atacantes)
    server_tokens off;

    server {
        listen 8000;
        # Solo /public es accesible; el resto del código queda fuera del web root
        root /var/www/html/public;
        index index.php;

        location / {
            # Patrón estándar de Laravel: todo pasa por index.php
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            # PHP-FPM corre en el mismo contenedor, puerto 9000
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        }

        # Bloquea archivos ocultos (.env, .git, etc.) excepto .well-known
        location ~ /\.(?!well-known).* { deny all; }
    }
}
