name: docker-ecosystem

services:
  # ---------------- BASE DE DATOS ----------------
  db:
    image: mysql:8.0
    container_name: eco_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # Volumen nombrado: los datos sobreviven aunque borres el contenedor
      - mysql_data:/var/lib/mysql
      # Scripts SQL de inicialización (solo lectura)
      - ./database/init:/docker-entrypoint-initdb.d:ro
    # SIN "ports": el 3306 no se expone al host, solo es accesible dentro de la red Docker
    networks:
      - backend_net
    healthcheck:
      # El backend espera a que MySQL esté realmente listo, no solo "iniciado"
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------- BACKEND (Laravel) ----------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eco_backend
    restart: unless-stopped
    environment:
      APP_NAME: "API Productos"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      # Logs a stderr para verlos con `docker compose logs`
      LOG_CHANNEL: stderr
      # Cache/sesión en archivos y cola síncrona: así la API no depende de tablas extra
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      # "db" es el nombre del servicio: Docker lo resuelve como hostname en la red
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net

  # ---------------- FRONTEND (Next.js) ----------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Se pasa en BUILD porque Next "quema" las NEXT_PUBLIC_* en el bundle
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: eco_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_net

# Dos redes: el frontend NO puede hablar directo con la base de datos
networks:
  backend_net:
  frontend_net:

volumes:
  mysql_data:
